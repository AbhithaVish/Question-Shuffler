<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Group Assignment Shuffler — Modern UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --glass: rgba(255,255,255,0.04);
      --muted: rgba(255,255,255,0.65);
      --accent: linear-gradient(135deg,#7c3aed 0%, #06b6d4 100%);
      --radius: 14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:'Inter',system-ui;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(124,58,237,0.12), transparent 8%),
                  radial-gradient(900px 500px at 90% 90%, rgba(6,182,212,0.08), transparent 10%),
                  var(--bg);
      color:#e6eef8;
      padding:32px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .app{
      width:100%;
      max-width:920px;
      display:grid;
      grid-template-columns: 1fr 380px;
      gap:22px;
    }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.04);
      border-radius:var(--radius);
      padding:22px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
      backdrop-filter: blur(6px) saturate(120%);
    }
    header h1{font-size:20px;margin:0 0 6px 0;font-weight:700}
    header p{margin:0;color:var(--muted);font-size:13px}
    .controls{display:flex;flex-direction:column;gap:12px;}
    .input-row{display:flex;gap:10px}
    .input-row input{
      flex:1;padding:12px 14px;border-radius:10px;border:none;background:var(--glass);color:inherit;outline:none;font-size:15px;
      box-shadow: inset 0 -1px 0 rgba(255,255,255,0.02);
    }
    .primary{
      display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600;color:white;background:var(--accent);
      box-shadow:0 6px 18px rgba(3,7,18,0.6);
    }
    .secondary{
      display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.04);
      color:var(--muted);cursor:pointer;font-weight:600
    }
    .members{display:flex;flex-direction:column;gap:10px;margin-top:6px;max-height:300px;overflow:auto;padding-right:6px}
    .member{
      display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);border:1px solid rgba(255,255,255,0.02);
    }
    .avatar{
      min-width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#374151 0%, #111827 100%);
      display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px
    }
    .mname{flex:1;font-weight:600}
    .small{font-size:13px;padding:6px 10px;border-radius:8px}
    .results{display:flex;flex-direction:column;gap:12px;}
    .assignments{display:grid;gap:10px;overflow:auto;max-height:520px;padding-right:6px}
    .assignment-card{
      padding:12px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.03)
    }
    .assignment-card h4{margin:0 0 8px 0;font-size:14px}
    .question-list{margin:0;color:var(--muted);font-size:14px}
    .hint{font-size:13px;color:var(--muted)}
    @media (max-width:860px){
      .app{grid-template-columns:1fr;}
      .results{order:2}
    }
    .pulse{animation:pulse 1.8s infinite}
    @keyframes pulse{0%{transform:translateY(0)}50%{transform:translateY(-4px)}100%{transform:translateY(0)}}
  </style>
</head>
<body>
  <div class="app">
    <div class="card controls">
      <header>
        <h1>Group Assignment Question Shuffler</h1>
        <p class="hint">Add members, then shuffle to assign questions fairly.</p>
      </header>

      <div style="display:flex;gap:12px;margin-top:12px;">
        <div style="flex:1">
          <div class="input-row">
            <input id="memberName" placeholder="Enter team member name">
            <button id="addBtn" class="secondary small">Add</button>
          </div>
          <div class="hint" style="margin-top:8px">Tip: Duplicate names are ignored.</div>
        </div>

        <div style="width:160px;display:flex;flex-direction:column;gap:8px;">
          <button id="shuffleBtn" class="primary pulse">Shuffle & Assign</button>
          <button id="clearBtn" class="secondary small">Clear All</button>
        </div>
      </div>

      <h3 style="margin:16px 0 6px 0;font-size:13px;color:var(--muted)">Team Members</h3>
      <div id="memberList" class="members"></div>

      <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;">
        <div class="hint">Questions: 7</div>
        <div style="display:flex;gap:8px">
          <button id="exportBtn" class="secondary small">Copy Assignments</button>
          <button id="downloadBtn" class="secondary small">Download JSON</button>
        </div>
      </div>
    </div>

    <div class="card results">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <h2 style="margin:0;font-size:18px">Assignments</h2>
          <div class="hint" id="assignedHint">No assignments yet — press Shuffle.</div>
        </div>
      </div>

      <div id="results" class="assignments"></div>

      <div class="footer-actions">
        <button id="resetAssignments" class="secondary small">Reset Assignments</button>
      </div>
    </div>
  </div>

<script>
/* SkySwift Project Questions */
const questions = [
  "1. Identify and evaluate ethical, social, professional, and legal issues related to the SkySwift project with examples. (20 Marks)",
  "2. Identify the software patents and rights to protect the intellectual property of the SkySwift project. (15 Marks)",
  "3. Describe how to adhere to data protection regulations, such as the Data Protection Act, in safeguarding user data collected by the development team. (15 Marks)",
  "4. Briefly describe the selected emerging technology, its pros and cons, with real-world examples for the SkySwift project. (10 Marks)",
  "5. Discuss how this innovative emerging technology influences various aspects of daily life. (10 Marks)",
  "6. Describe how to implement Green IT initiatives and the positive impact on society by applying Green IT to the SkySwift project. (10 Marks)",
  "7. Provide a conclusion and recommendations for the future development of the SkySwift project based on professional practice theories learned. (10 Marks)"
];

const members = [];

const nameInput = document.getElementById('memberName');
const addBtn = document.getElementById('addBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const memberList = document.getElementById('memberList');
const resultsContainer = document.getElementById('results');
const assignedHint = document.getElementById('assignedHint');
const clearBtn = document.getElementById('clearBtn');
const exportBtn = document.getElementById('exportBtn');
const downloadBtn = document.getElementById('downloadBtn');
const resetAssignmentsBtn = document.getElementById('resetAssignments');

function initials(name){
  return name.split(' ').map(s=>s[0].toUpperCase()).join('').slice(0,2);
}

function renderMembers(){
  memberList.innerHTML='';
  members.forEach((m, i)=>{
    const div = document.createElement('div');
    div.className = 'member';
    div.innerHTML = `
      <div class="avatar">${initials(m)}</div>
      <div class="mname">${m}</div>
      <button class="secondary small" data-i="${i}">🗑</button>
    `;
    memberList.appendChild(div);
  });

  memberList.querySelectorAll("[data-i]").forEach(btn=>{
    btn.onclick = () => { members.splice(btn.dataset.i,1); renderMembers(); clearResults(); };
  });
}

function addMember(){
  const val = nameInput.value.trim();
  if(!val || members.includes(val)) return;
  members.push(val);
  nameInput.value='';
  renderMembers();
}

addBtn.onclick = addMember;
nameInput.onkeydown = e => { if(e.key==="Enter") addMember(); };

function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let lastAssignments = null;

/* Random start offset to avoid bias */
function shuffleQuestions(){
  if(members.length===0){ alert("Add members first."); return; }

  const shuffledQuestions = shuffleArray(questions);
  const assignments = {};
  members.forEach(m => assignments[m] = []);

  const start = Math.floor(Math.random() * members.length);

  shuffledQuestions.forEach((q,i)=>{
    const assignedMember = members[(i + start) % members.length];
    assignments[assignedMember].push(q);
  });

  lastAssignments = assignments;
  renderAssignments(assignments);
}

function renderAssignments(assignments){
  resultsContainer.innerHTML = '';
  members.forEach(m=>{
    const div = document.createElement('div');
    div.className = 'assignment-card';

    div.innerHTML = `
      <h4>${m} — ${assignments[m].length} item(s)</h4>
      <ul class="question-list" style="list-style:none;padding-left:0;margin-left:0;">
        ${assignments[m].map(q=>`<li>${q}</li>`).join('')}
      </ul>
    `;

    resultsContainer.appendChild(div);
  });

  assignedHint.textContent = "Assignments generated successfully.";
}

function clearResults(){
  resultsContainer.innerHTML='';
  assignedHint.textContent='No assignments yet — press Shuffle.';
  lastAssignments=null;
}

shuffleBtn.onclick = shuffleQuestions;

clearBtn.onclick = () => {
  if(confirm("Clear all members?")){
    members.length = 0;
    renderMembers();
    clearResults();
  }
};

exportBtn.onclick = () => {
  if(!lastAssignments){ alert("No assignments to copy."); return; }
  const text = Object.entries(lastAssignments)
    .map(([k,v])=>`${k}:\n${v.map((q,i)=>`  ${i+1}. ${q}`).join("\n")}`)
    .join("\n\n");
  navigator.clipboard.writeText(text).then(()=>alert("Copied!"));
};

downloadBtn.onclick = () => {
  if(!lastAssignments){ alert("No assignments to download."); return; }
  const blob = new Blob([JSON.stringify(lastAssignments,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download="assignments.json"; a.click();
  URL.revokeObjectURL(url);
};

resetAssignmentsBtn.onclick = clearResults;
</script>

</body>
</html>
